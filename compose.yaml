services:
  frontend:
    container_name: habitual-frontend
    build: ./frontend
    ports:
      - "9000:9000"
    volumes:
      - ./frontend:/app   # bind mount: edits to frontend files show up in real time in the container
      - /app/node_modules # keep the containers linux node modules
  backend:
    container_name: habitual-backend
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:9000}
    volumes:
      - ./backend:/app    # so the container sees live edits to backend files
      - /app/node_modules # keep the linux node modules
    depends_on:
      - db
    command: npm run dev  # override the Dockerfile's CMD for local dev
  db:
    image: postgres:18
    container_name: habitual-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: habitual
    ports:
      - "5432:5432" # lets you connect from your local device through psql, VS Code, pgAdmin, etc
    volumes:
      - db-data:/var/lib/postgresql # keep db data when the container is removed
      - ./db/init:/docker-entrypoint-initdb.d # run the init .sql files on first startup
volumes:
  db-data:
