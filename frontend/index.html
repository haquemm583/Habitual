<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Habitual: a habit and task tracker." />
    <link rel="icon" type="image/png" href="/favicon.png?v=habitual" />
    <title>Habitual</title>
    <!-- Apply the theme before the page renders. -->
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('habitual-theme');
        } catch {
          // Use the device preference when browser storage is unavailable.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="min-w-0 bg-canvas font-[system-ui,sans-serif] leading-normal font-normal text-foreground antialiased [font-synthesis:none] [text-rendering:optimizeLegibility]">
    <div id="root" class="flex min-h-screen flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
